# Durable Object `LabDb` と Container (../container) を持つだけのスクリプト。(A) worker-unknown と
# (B) worker-emscripten は、どちらも wrangler.toml の script_name でこの DO を参照する。DO の版を変えるときは
# これだけを先にデプロイし、その後で A と B を並列にデプロイする (CI の deploy-staging-db)。
# A・B と混ざらないよう、自前の Cargo.lock を持つ独立 workspace。
[package]
name = "lab-db"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# TCP 中継 (copy_bidirectional)
tokio = { version = "1", default-features = false, features = ["io-util"] }
# GET /rtt (DO の中から Container へ SELECT 1)
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# worker-build (CI と wrangler.toml の [build]) と同じ 0.8.7 に固定する
worker = "=0.8.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

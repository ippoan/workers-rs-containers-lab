# wasm32-unknown-unknown 版の probe (GET /zip?mb=N[&mode=copy|stream|flush]・/sign・/pdf)。Container と DO は使わない。
#
# 到達経路を絞る (public repo なので、ホスト名・account_id・Access の設定はここに書かない):
#   - トップレベル: workers_dev = false / preview_urls = false、route / routes / custom_domain を書かない
#   - env.staging だけ workers_dev = true。その workers.dev のホスト名は Cloudflare Access で保護する
#   scripts/check-exposure.sh が CI で毎回これを検査する。
name = "lab-probe-unknown"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
# --panic-unwind は浮動の nightly (+ rust-src) を使う (worker-build 0.8.7 が toolchain 名 `nightly` を決め打ち。README「panic=unwind」)
command = "cargo install -q worker-build@0.8.7 --locked && worker-build --release --panic-unwind"

[env.staging]
name = "lab-probe-unknown-staging"
workers_dev = true
preview_urls = false

[env.staging.observability]
enabled = true

# Placement Hints: DB 比較の worker と同じ置き場所 (AWS 東京リージョンの近く)。staging だけ
[env.staging.placement]
region = "aws:ap-northeast-1"

# mode=flush が運行ごとの CSV を書き出す先 (リクエストの終わりに prefix ごと消す)。
# wrangler deploy の自動作成 (4.143.0 の resource provisioning) は location を指定できず ENAM になったので、
# APAC を明示して事前に `wrangler r2 bucket create <名前> --location apac` で作る。
# 無い名前のまま deploy すると ENAM で自動作成される。staging だけ
[[env.staging.r2_buckets]]
binding = "LAB_R2"
bucket_name = "lab-probe-apac"

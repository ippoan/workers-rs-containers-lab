# (A) wasm32-unknown-unknown 版の worker。
#
# 到達経路を絞る (public repo なので、ホスト名・account_id・Access の設定はここに書かない):
#   - トップレベル: workers_dev = false / preview_urls = false、route / routes / custom_domain を書かない
#   - env.staging だけ workers_dev = true。その workers.dev のホスト名は Cloudflare Access で保護する
#     (アプリ・ポリシー・service token は Access 側で管理する。Access を通らないリクエストは Worker に届かない)
#   scripts/check-exposure.sh が CI で毎回これを検査する。
name = "lab-unknown"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q worker-build@0.8.7 --locked && worker-build --release"

# staging: DB は Cloudflare Containers (postgres + PgBouncer transaction mode、../container/) を
# 抱える Durable Object LabDb。DO と Container は ../lab-db (lab-db-staging) にあり、script_name で参照する。
# Worker → LabDb へ TCP → Container の 6432 へ中継 (lab-db/src/lab_db.rs)。
#   wrangler deploy --env staging   (Access の設定と lab-db-staging のデプロイが先)
[env.staging]
name = "lab-unknown-staging"
workers_dev = true
preview_urls = false

[env.staging.observability]
enabled = true

# Placement Hints: Worker の fetch handler を DO / Container (NRT) に近い AWS 東京リージョンの近くで動かす
# (無いとリクエストを受けた拠点で動き、SIN などから DO まで往復することがある)。staging だけ
[env.staging.placement]
region = "aws:ap-northeast-1"

# 2 段の移し替えの途中 (1 段目): LAB_DB の binding を一時的に外している。同じクラス名 LabDb への binding
# (script_name = "lab-db-staging") と v2 の deleted_classes = ["LabDb"] は同時に適用できない (code 10061) ので、
# 1 段目で binding を外して古い LabDb を消し、2 段目で binding を戻す。そのあいだ /query は 503 を返す。

# LabDb はかつてこのスクリプトにあった (v1)。lab-db-staging へ分けたので v2 で消す。LabDb は中継だけで
# 状態を持たないので、移さず (transferred_classes にせず) lab-db-staging で新しく作り直している。
# deleted_classes は「ほかの Worker がこの namespace を bind していない」ことが条件 (B は lab-db-staging を見る)
[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["LabDb"]

[[env.staging.migrations]]
tag = "v2"
deleted_classes = ["LabDb"]
